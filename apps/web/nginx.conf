# Serves the built SPA and proxies /api to the backend, mirroring the Vite
# dev proxy so the browser always talks to a single origin.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    # Slightly above the api's own 1 MB upload limit, so oversized uploads get
    # the api's JSON 413 instead of nginx's HTML error page.
    client_max_body_size 2m;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Answers will be streamed over SSE; don't buffer them.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # Vite emits content-hashed filenames, so these can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
