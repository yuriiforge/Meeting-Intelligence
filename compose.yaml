# Full stack: `docker compose up --build`, then open http://localhost:8080
# Dependencies only (for `npm run dev`): `npm run deps:up` (db + ollama)

x-database-url: &database-url postgresql://${POSTGRES_USER:-mi}:${POSTGRES_PASSWORD:-mi}@db:5432/${POSTGRES_DB:-meeting_intelligence}

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mi}
      POSTGRES_DB: ${POSTGRES_DB:-meeting_intelligence}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Local model server for embeddings (and, later, the dev LLM). CPU-only here;
  # a native Ollama install is usually faster on Windows/macOS (see README).
  ollama:
    image: ollama/ollama:0.40.16
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 20

  # Downloads the embedding model into the shared volume once, then exits.
  # Instant on later runs: the model is already there.
  ollama-pull:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ['pull', '${EMBEDDING_MODEL:-nomic-embed-text}']
    depends_on:
      ollama:
        condition: service_healthy

  # Applies database migrations once, then exits.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      PORT: 3000
      DATABASE_URL: *database-url
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  ollama-models:
